<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Teammate</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div id="app-root"></div>
    <dialog id="new-task-modal" aria-labelledby="new-task-title">
      <form id="new-task-form">
        <div class="modal-heading">
          <div>
            <p class="eyebrow">NEW TASK</p>
            <h2 id="new-task-title">What should your team work on?</h2>
          </div>
          <button class="icon-button" value="cancel" formmethod="dialog" aria-label="Close dialog">×</button>
        </div>
        <label class="field-label" for="task-title">Task</label>
        <input id="task-title" name="title" maxlength="160" placeholder="e.g. Compare project management tools" required />
        <label class="field-label" for="task-description">Details <span class="optional">Optional</span></label>
        <textarea id="task-description" name="description" rows="4" maxlength="8000" placeholder="Add context, links, or what a good result looks like."></textarea>
        <label class="field-label" for="task-bot">Assign to</label>
        <select id="task-bot" name="botId" required></select>
        <p class="form-note">Tasks are saved on this device. Connect a model before asking a bot to run one.</p>
        <div class="modal-actions">
          <button class="button button-quiet" value="cancel" formmethod="dialog">Cancel</button>
          <button class="button button-primary" type="submit">Save task</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
