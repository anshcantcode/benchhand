[package]
name = "teammate-desktop"
version = "0.2.0"
description = "A local-first team of AI teammates"
authors = ["Teammate contributors"]
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1", features = ["time", "macros", "sync"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
