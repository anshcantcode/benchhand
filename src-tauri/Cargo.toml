[package]
name = "benchhand"
version = "0.4.2"
description = "A local-first team of AI teammates"
authors = ["Benchhand contributors"]
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1", features = ["time", "macros", "sync", "process", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
base64 = "0.23"
sha2 = "0.11"
ed25519-dalek = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
enigo = { version = "0.6.1", features = ["wayland"] }
xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri = { version = "2", features = ["tray-icon"] }
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
