name: Desktop packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            build_script: build:windows
          - platform: linux-x64
            os: ubuntu-24.04
            build_script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            wget

      - run: npm ci

      - name: Rust runtime checks
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install UI test browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Interface checks
        if: runner.os == 'Linux'
        run: npm run test:ui

      - name: Build desktop packages
        run: npm run ${{ matrix.build_script }}

      - uses: actions/upload-artifact@v4
        with:
          name: teammate-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
