name: Desktop packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            build_script: build:windows
          - platform: linux-x64
            os: ubuntu-24.04
            build_script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            wget

      - run: npm ci

      - name: Rust runtime checks
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install UI test browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Interface checks
        if: runner.os == 'Linux'
        run: npm run test:ui

      - name: Build desktop packages
        run: npm run ${{ matrix.build_script }}

      - uses: actions/upload-artifact@v4
        with:
          name: teammate-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect packages and checksums
        run: |
          mkdir release
          find artifacts -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat >> notes.md <<'EOF'

          ### Download

          | Platform | Package |
          | --- | --- |
          | Windows 10 and 11, x64 | `Teammate_*_x64-setup.exe` |
          | Ubuntu 24.04+ and Debian-based Linux, x64 | `Teammate_*_amd64.deb` |
          | Other Linux, x64 | `Teammate_*_amd64.AppImage` |

          Model weights, model runtimes such as Ollama, and optional tool servers are installed separately. `SHA256SUMS.txt` lists the package hashes. See the [user guide](https://github.com/anshcantcode/teammate/blob/main/docs/USER_GUIDE.md) to get started.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: Teammate ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: release/*
